name: Deploy Sphere WordPress to Hostinger
on:
  push:
    branches: [main]
    paths: ['wordpress/**', 'scripts/build-wordpress.mjs', 'package*.json', '.github/workflows/hostinger.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sphere-hostinger
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: hostinger-production
      url: https://studiospheredesign.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - run: npm ci
      - run: node scripts/build-wordpress.mjs
      - name: Validate PHP
        run: find wordpress -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Prepare release
        run: |
          mkdir -p release/theme release/mu-plugins release/plugins
          rsync -a --exclude=seed.json wordpress/sphere/ release/theme/
          cp wordpress/sphere-*.php wordpress/sphere-*.css wordpress/sphere-*.js release/mu-plugins/
          rsync -a wordpress/plugins/ release/plugins/
          tar -czf release.tar.gz -C release .
      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.SPHERE_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.SPHERE_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Upload and deploy code
        env:
          HOST: ${{ vars.SPHERE_HOST }}
          PORT: ${{ vars.SPHERE_PORT }}
          SSH_USER: ${{ vars.SPHERE_USER }}
        run: |
          ssh -p "$PORT" "$SSH_USER@$HOST" "mkdir -p /home/$SSH_USER/sphere-releases/$GITHUB_SHA"
          scp -P "$PORT" release.tar.gz "$SSH_USER@$HOST:/home/$SSH_USER/sphere-releases/$GITHUB_SHA/release.tar.gz"
          ssh -p "$PORT" "$SSH_USER@$HOST" "bash -s -- $GITHUB_SHA" < wordpress/deploy-hostinger.sh
      - name: Verify public release
        run: |
          curl --fail --retry 3 --retry-delay 5 "https://studiospheredesign.com/?release=$GITHUB_SHA" -o /tmp/sphere.html
          grep -q 'Sphere Design' /tmp/sphere.html
          curl --fail --retry 3 https://studiospheredesign.com/wp-sitemap.xml -o /dev/null
